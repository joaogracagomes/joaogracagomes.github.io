<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Flaw of Averages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --room:#E4EAE8; --panel:rgba(255,255,255,.94); --panel-solid:#FFFFFF; --well:#EDF1F0;
  --ink:#12272B; --ink-2:#455B5E; --ink-3:#6F8385; --rule:rgba(18,39,43,.14); --rule-2:rgba(18,39,43,.3); --zone:rgba(18,39,43,.07);
  --p1:#C48200; --p2:#0E8C7A; --p3:#6E4FD6; --loss:#C6402A; --loss-wash:rgba(198,64,42,.11);
  --btn:#12272B; --btn-ink:#F4F7F6;
  --lift:0 22px 56px -22px rgba(18,39,43,.42);
  --text:Barlow,"Segoe UI",system-ui,sans-serif; --num:"Barlow Semi Condensed",Barlow,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --room:#142326; --panel:rgba(27,47,51,.94); --panel-solid:#1B2F33; --well:#223A3F;
    --ink:#E9F0EE; --ink-2:#AFC0BE; --ink-3:#839796; --rule:rgba(233,240,238,.15); --rule-2:rgba(233,240,238,.34); --zone:rgba(233,240,238,.08);
    --p1:#F0B429; --p2:#3CC4AE; --p3:#A692F8; --loss:#F27560; --loss-wash:rgba(242,117,96,.15);
    --btn:#E9F0EE; --btn-ink:#12272B;
    --lift:0 22px 56px -22px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --room:#142326; --panel:rgba(27,47,51,.94); --panel-solid:#1B2F33; --well:#223A3F;
  --ink:#E9F0EE; --ink-2:#AFC0BE; --ink-3:#839796; --rule:rgba(233,240,238,.15); --rule-2:rgba(233,240,238,.34); --zone:rgba(233,240,238,.08);
  --p1:#F0B429; --p2:#3CC4AE; --p3:#A692F8; --loss:#F27560; --loss-wash:rgba(242,117,96,.15);
  --btn:#E9F0EE; --btn-ink:#12272B;
  --lift:0 22px 56px -22px rgba(0,0,0,.7);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--room);color:var(--ink);font:400 15px/1.5 var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── layout ── */
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w,446px);grid-template-rows:auto minmax(0,1fr);transition:grid-template-columns .55s cubic-bezier(.3,.7,.2,1)}
#app.wide{--panel-w:min(800px,59vw)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#free{grid-column:1;grid-row:2;pointer-events:none;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2)}
.no3d #scene,.no3d #tags{display:none}

.bar{grid-column:1/-1;grid-row:1;position:relative;z-index:3;display:flex;align-items:center;gap:22px;padding:12px 16px 10px 20px;pointer-events:none}
.bar > *{pointer-events:auto}
.brand{font:600 19px/1.1 var(--num);letter-spacing:.01em;margin:0;white-space:nowrap}
.brand span{display:block;font:400 13px/1.3 var(--text);color:var(--ink-2);letter-spacing:0}
.steps{list-style:none;display:flex;align-items:center;gap:6px;margin:0 auto;padding:0}
.step{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:13px;white-space:nowrap}
.step + .step::before{content:"";width:16px;height:1px;background:var(--rule-2);margin-right:1px}
.step-card{display:grid;place-items:center;width:20px;height:27px;border-radius:4px;border:1.5px solid var(--rule-2);font:600 13px/1 var(--num);transition:background .3s,color .3s,border-color .3s,transform .3s}
.step.is-done .step-card{background:var(--ink-3);border-color:transparent;color:var(--room)}
.step.is-now{color:var(--ink);font-weight:600}
.step.is-now .step-card{background:var(--ink);border-color:var(--ink);color:var(--room);transform:translateY(-2px) rotate(-4deg)}
.restart{appearance:none;border:1px solid var(--rule-2);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer}
.restart:hover{border-color:var(--ink)}

/* ── briefing panel ── */
#panel{grid-column:2;grid-row:2;align-self:start;max-height:calc(100% - 16px);margin:4px 16px 16px 0;position:relative;z-index:2;
  background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--lift);
  padding:22px;overflow:auto;container:panel/inline-size}
.view.enter{animation:enter .4s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h{font:600 25px/1.18 var(--num);letter-spacing:.004em;margin:0 0 8px;text-wrap:balance}
.h2{font:600 16px/1.3 var(--text);margin:20px 0 0}
.lead{margin:0;color:var(--ink-2);max-width:52ch}
.lead + .lead{margin-top:8px}
.aside{margin:12px 0 0;padding:9px 12px;border-left:3px solid var(--ink-3);background:var(--well);border-radius:0 8px 8px 0;color:var(--ink-2)}
.aside b{color:var(--ink);font-weight:600}
.quote{margin:16px 0 0;font:500 19px/1.32 var(--num);text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{appearance:none;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);font:600 15px/1.1 var(--text);padding:13px 18px;cursor:pointer;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn.small{padding:8px 12px;font-size:14px}
.neg{color:var(--loss)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:1px}

.choices{display:grid;gap:8px;margin-top:14px}
.choice{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px 9px 10px;border-radius:10px;border:1px solid var(--rule);background:transparent;cursor:pointer;transition:border-color .15s,background .15s}
.choice::before{content:"";width:8px;align-self:stretch;min-height:34px;border-radius:3px;background:var(--c)}
.choice:hover,.choice.is-hover{border-color:var(--rule-2)}
.choice[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 11%,transparent)}
.choice-name b{font-weight:600}
.choice-name small{display:block;color:var(--ink-3);font-size:13px;line-height:1.3}
.choice-metric{text-align:right}
.choice-metric small{display:block;color:var(--ink-3);font-size:12px;line-height:1.2}
.choice-metric strong{font:600 21px/1.1 var(--num)}

.grid{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.grid th,.grid td{padding:7px 0 7px 8px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:baseline;font-weight:400}
.grid th:first-child{text-align:left;padding-left:0}
.grid thead th{font-weight:600;white-space:nowrap}
.grid thead small,.grid tbody small{display:block;color:var(--ink-3);font-size:12px;font-weight:400;line-height:1.25}
.grid td b{font:600 18px/1.1 var(--num)}
.grid tbody th{font-weight:500}
.grid tr.is-key th,.grid tr.is-key td{border-bottom-color:var(--rule-2)}

.kv{width:100%;border-collapse:collapse;margin-top:14px}
.kv th{font-weight:400;color:var(--ink-2);text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--rule)}
.kv td{text-align:right;padding:7px 0;border-bottom:1px solid var(--rule);font-weight:600}
.kv tr:last-child td{font:600 22px/1.1 var(--num)}

.chain{list-style:none;margin:14px 0 0;padding:0}
.chain li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule);font-weight:500}
.chain small{display:block;font-weight:400;color:var(--ink-3);font-size:13px;line-height:1.3}
.chain b{font:600 19px/1.1 var(--num);white-space:nowrap}
.chain li.total{border-bottom:0;border-top:1.5px solid var(--ink);margin-top:-1px;padding-top:10px}
.chain li.total b{font-size:32px}
.enter .chain li,.enter .stack,.enter .stack-key{animation:rowin .45s both cubic-bezier(.2,.7,.2,1);animation-delay:calc(var(--i)*.24s + .2s)}
@keyframes rowin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.stack{display:flex;height:24px;border-radius:5px;overflow:hidden;margin-top:14px;gap:2px}
.stack i{display:block;height:100%;background:var(--ink-3)}
.stack i:nth-child(2){opacity:.55}
.stack i.is-npv{background:var(--c)}
.stack-key{display:flex;flex-wrap:wrap;gap:2px 14px;margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.stack-key b{font-weight:600;color:var(--ink)}

.bars{display:grid;gap:9px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:118px minmax(0,1fr) 62px;align-items:center;gap:10px}
.bar-name{font-weight:600;line-height:1.2}
.bar-name small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.bar-track{position:relative;height:22px;background:var(--well);border-radius:4px}
.bar-fill{position:absolute;top:0;bottom:0;background:var(--c,var(--ink-3));border-radius:4px;transition:left .95s cubic-bezier(.25,.7,.2,1),width .95s cubic-bezier(.25,.7,.2,1)}
.bar-zero{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--rule-2)}
.bar-val{font:600 19px/1 var(--num);text-align:right}
.key{margin:8px 0 0;color:var(--ink-3);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.key i{display:inline-block;vertical-align:-2px;margin-right:6px}
.key .k-a{width:0;height:14px;border-left:2px solid var(--ink)}
.key .k-b{width:0;height:14px;border-left:2px dashed var(--ink)}
.key .k-loss{width:14px;height:14px;border-radius:2px;background:var(--loss-wash);outline:1px solid var(--loss)}
.key .k-draw{width:12px;height:12px;border-radius:2px;border:2px solid var(--ink)}
.sum{margin:10px 0 0;padding:9px 12px;background:var(--well);border-radius:8px;font:500 16px/1.45 var(--num)}
.sum b{font-weight:700}

/* stage 4 */
.approach{margin-top:12px;padding:14px 16px 16px;border:1px solid var(--rule);border-radius:12px}
.approach h3{margin:0 0 4px;font:600 17px/1.25 var(--text)}
.approach p{margin:0;color:var(--ink-2)}
.approach .actions{margin-top:12px}
.approach.is-off{opacity:.5}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:10px!important;color:var(--ink)!important}
.result strong{font:700 34px/1 var(--num)}
.versus{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:14px;margin-top:12px}
.tile{border:1px solid var(--rule-2);border-radius:12px;padding:12px 16px 14px}
.tile small{display:block;font-weight:600;font-size:15px}
.tile strong{display:block;font:700 62px/1 var(--num);margin:4px 0 6px}
.tile p{margin:0;color:var(--ink-2);font:500 14px/1.4 var(--num)}
.tile.is-b{border-color:var(--loss);background:var(--loss-wash)}
.neq{align-self:center;font:700 46px/1 var(--num);color:var(--ink-3)}
.motto{font:700 clamp(25px,5.2cqi,40px)/1.03 var(--num);text-transform:uppercase;letter-spacing:.012em;margin:18px 0 0;text-wrap:balance}
.gapline{margin:8px 0 0;color:var(--ink-2)}
.gapline b{color:var(--ink);font-weight:600}
.why{display:grid;gap:10px 24px;margin-top:14px}
.jensen{position:relative;height:262px}
.why .lead{max-width:none}
.formula{margin:10px 0 0;font:500 14px/1.4 var(--num);color:var(--ink-3)}
.linkish{appearance:none;border:0;background:none;padding:0;margin-top:8px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink-2)}
@container panel (min-width:640px){.why{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
@container panel (max-width:520px){.versus{grid-template-columns:minmax(0,1fr)}.neq{justify-self:center}.tile strong{font-size:48px}}

/* stage 6 */
.seg{display:inline-flex;margin-top:12px;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:500;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--room)}
.dist{display:grid;gap:6px 22px;margin-top:10px}
@container panel (min-width:640px){.dist{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);align-items:start}}
.charts{display:grid;gap:2px}
.chart-box{position:relative;height:102px}
.chart-box.has-axis{height:128px}
.charts.single .chart-box{height:280px}
.chart-cap{position:absolute;left:46px;top:0;font-size:13px;font-weight:600;line-height:1;pointer-events:none}
.takeaways{margin:14px 0 0;padding:0;list-style:none;counter-reset:t;display:grid;gap:12px}
.takeaways li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;align-items:baseline;font:500 19px/1.3 var(--num)}
.takeaways li::before{content:counter(t);font:700 26px/1 var(--num);color:var(--ink-3)}

/* ── floating indicators ── */
.tag{position:absolute;left:0;top:0;background:var(--panel-solid);border:1px solid var(--rule);border-top:3px solid var(--c,var(--ink-3));border-radius:8px;padding:5px 11px 7px;text-align:center;white-space:nowrap;box-shadow:0 10px 22px -12px rgba(8,20,22,.55);opacity:0;transition:opacity .3s;will-change:transform}
.tag small{display:block;font-size:12px;line-height:1.3;color:var(--ink-2)}
.tag strong{display:block;font:600 23px/1.1 var(--num)}
.tag em{display:block;font-style:normal;font-size:12px;line-height:1.3;color:var(--ink-3)}
.tag .badge{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-7px);background:var(--ink);color:var(--room);font-size:11px;font-weight:600;line-height:1;padding:4px 8px;border-radius:99px}

@media (max-width:1180px){.step:not(.is-now) .step-name{display:none}.brand span{display:none}}
@media (max-width:860px){
  body{font-size:14px}
  #app,#app.wide{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(150px,1fr) auto}
  #free{grid-row:2}
  #panel{grid-column:1;grid-row:3;margin:0 10px 10px;max-height:60vh;padding:16px}
  .bar{gap:10px;padding:10px 12px}
  .step + .step::before{width:6px}
  .h{font-size:21px}
  .tag strong{font-size:16px}.tag small,.tag em{font-size:10px}.tag{padding:3px 6px 4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Investment table with three plant cards"></canvas>
  <div id="tags" aria-hidden="true"></div>
  <header class="bar">
    <h1 class="brand">The Flaw of Averages<span>A card game about uncertainty and investment</span></h1>
    <ol class="steps" id="steps" aria-label="Game progress"></ol>
    <button class="restart" id="restart" type="button">Restart</button>
  </header>
  <div id="free"></div>
  <aside id="panel" aria-live="polite"></aside>
</div>
<noscript>This game needs JavaScript.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   1. CONFIG — every assumption in the game lives here
   ═══════════════════════════════════════════════════════════════════ */
const CONFIG = {
  currency: '€',                      // money is shown in millions: €35M
  // Any value in `finance` can be overridden on a single plant by giving the plant the same key.
  finance: {
    price: 100,                       // €/MWh
    discountRate: 0.08,               // per year
    lifetimeYears: 20,
    fixedOpexPerMW: 0.04,             // €M per MW per year, paid whatever the generation
    maxFullLoadHours: 2500,           // capacity limit: deliverable energy ≤ capacity × this many hours a year
    minDeliveryShare: 0.75,           // minimum delivery = this share of the forecast generation
    penaltyPrice: 100                 // €/MWh paid on every MWh short of the minimum delivery (here: the price itself,
                                      // as if the missing power had to be bought elsewhere)
  },
  // Generation in a scenario = the plant's forecast generation × multiplier.
  // Plant X: 100 / 200 / 300 GWh. Probabilities are normalised if they do not sum to 1.
  // A plant can carry its own `multipliers: { low: 0.7, high: 1.2 }` to give it a different spread.
  scenarios: [
    { id: 'low',      label: 'Low generation',      short: 'Low',      multiplier: 0.5, probability: 0.25 },
    { id: 'expected', label: 'Expected generation', short: 'Expected', multiplier: 1.0, probability: 0.50 },
    { id: 'high',     label: 'High generation',     short: 'High',     multiplier: 1.5, probability: 0.25 }
  ],
  // capacity MW · generation = forecast GWh/yr · investment €M (set so the forecast NPVs come out at 35 / 42 / 38)
  plants: [
    { id: 'X', capacity: 100, generation: 200, investment: 122 },
    { id: 'Y', capacity: 150, generation: 270, investment: 164 },
    { id: 'Z', capacity: 200, generation: 320, investment: 198 }
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   2. FINANCE — the central model. Pure functions, no DOM.

   For a plant p and a year's generation G (GWh):

     limit      = capacity × maxFullLoadHours / 1000         GWh/yr   capacity constraint
     minimum    = minDeliveryShare × forecast generation     GWh/yr   minimum generation threshold
     sold(G)    = min(G, limit)                              generation above the limit is wasted
     short(G)   = max(0, minimum − G)                        shortfall against the minimum
     revenue(G) = price × sold(G) − penaltyPrice × short(G)  €M/yr, net of the underproduction penalty
     cash(G)    = revenue(G) − fixedOpexPerMW × capacity     fixed cost shifts the line but does not bend it
     NPV(G)     = −investment + annuity(r, N) × cash(G)

   NPV(G) is piecewise linear with two kinks: steeper below `minimum` (each lost MWh costs
   price + penalty) and flat above `limit` (extra MWh earn nothing). That makes it CONCAVE,
   so by Jensen's inequality

     E[NPV(G)]  ≤  NPV(E[G])          average of the outcomes ≤ outcome of the average

   with a strict gap whenever the scenarios reach past either kink. Fixed operating costs alone
   would leave NPV linear in G and the two sides equal; the gap comes from the limit and the penalty.
   Nothing below is hardcoded: every number shown in the game is computed here from CONFIG.
   ═══════════════════════════════════════════════════════════════════ */
const Finance = (() => {
  const F = CONFIG.finance;
  const val = (p, k) => (p[k] != null ? p[k] : F[k]);
  const total = CONFIG.scenarios.reduce((a, s) => a + s.probability, 0);
  if (Math.abs(total - 1) > 1e-9) console.warn('Scenario probabilities sum to ' + total + '; normalising.');
  const scenarios = CONFIG.scenarios.map(s => ({ ...s, probability: s.probability / total }));

  function annuity(p) { const r = val(p, 'discountRate'), n = val(p, 'lifetimeYears'); let a = 0; for (let t = 1; t <= n; t++) a += 1 / Math.pow(1 + r, t); return a; }
  const limit = p => p.capacity * val(p, 'maxFullLoadHours') / 1000;
  const minimum = p => val(p, 'minDeliveryShare') * p.generation;
  const sold = (p, G) => Math.min(G, limit(p));
  const shortfall = (p, G) => Math.max(0, minimum(p) - G);
  const penalty = (p, G) => val(p, 'penaltyPrice') * shortfall(p, G) / 1000;            // GWh × €/MWh ÷ 1000 = €M
  const revenue = (p, G) => val(p, 'price') * sold(p, G) / 1000 - penalty(p, G);
  const opex = p => val(p, 'fixedOpexPerMW') * p.capacity;
  const cash = (p, G) => revenue(p, G) - opex(p);
  const npv = (p, G) => -p.investment + annuity(p) * cash(p, G);
  // The straight line a single average forecast implicitly assumes: no limit, no penalty. Used only for the stage 4 chart.
  const straight = (p, G) => -p.investment + annuity(p) * (val(p, 'price') * G / 1000 - opex(p));
  const terms = p => ({ price: val(p, 'price'), rate: val(p, 'discountRate'), years: val(p, 'lifetimeYears'), annuity: annuity(p), opex: opex(p), limit: limit(p), minimum: minimum(p), penaltyPrice: val(p, 'penaltyPrice') });

  function outcomes(p) {
    return scenarios.map(s => {
      const mult = p.multipliers && p.multipliers[s.id] != null ? p.multipliers[s.id] : s.multiplier, G = p.generation * mult;
      return { id: s.id, label: s.label, short: s.short || s.label, prob: s.probability, dev: mult - 1, generation: G,
               sold: sold(p, G), wasted: G - sold(p, G), shortfall: shortfall(p, G), penalty: penalty(p, G), revenue: revenue(p, G), npv: npv(p, G) };
    });
  }
  function analyse(p) {
    const list = outcomes(p);
    const avgGen = list.reduce((a, o) => a + o.prob * o.generation, 0);          // E[G]
    const npvAtAvg = npv(p, avgGen);                                              // Approach A: NPV(E[G])
    const expected = list.reduce((a, o) => a + o.prob * o.npv, 0);                // Approach B: E[NPV(G)] = Σ P(i) × NPV(i)
    const min = Math.min(...list.map(o => o.npv)), max = Math.max(...list.map(o => o.npv));
    if (Math.abs(avgGen - p.generation) > 1e-6 * p.generation)
      console.warn(`Plant ${p.id}: scenarios average ${avgGen} GWh but the forecast is ${p.generation} GWh. Approach A uses the scenario average.`);
    return {
      outcomes: list, byId: Object.fromEntries(list.map(o => [o.id, o])),
      forecast: npv(p, p.generation), avgGen, npvAtAvg, expected, gap: expected - npvAtAvg, min, max,
      pLoss: list.filter(o => o.npv < 0).reduce((a, o) => a + o.prob, 0),
      downside: min - expected,           // worst case measured against the expected NPV
      upside: max - expected              // best case measured against the expected NPV
    };
  }
  // NPV as a function of generation between g0 and g1: straight segments joined at the two kinks.
  function curve(p, g0, g1) {
    const xs = [g0, minimum(p), limit(p), g1].filter(g => g >= g0 && g <= g1).sort((a, b) => a - b);
    return xs.filter((g, i) => !i || g !== xs[i - 1]).map(g => ({ x: g, y: npv(p, g) }));
  }
  function draw() { let r = Math.random(); for (const s of scenarios) { if ((r -= s.probability) < 0) return s.id; } return scenarios[scenarios.length - 1].id; }
  return { scenarios, terms, revenue, npv, straight, outcomes, analyse, curve, draw };
})();

   ═══════════════════════════════════════════════════════════════════ */
const Theme = (() => {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const subs = [];
  const isDark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && mq.matches); };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fire = () => subs.forEach(f => f());
  if (mq.addEventListener) mq.addEventListener('change', fire);
  new MutationObserver(fire).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  return { isDark, css, onChange: f => subs.push(f) };
})();

          <tr><th>Realised NPV</th><td>${money(o.npv)}</td></tr></table>
          ${bars([{ name: 'What happened', note: 'realised NPV', value: o.npv, color: cv(C) }, { name: 'Approach A', note: 'average assumptions', value: a.npvAtAvg }, { name: 'Approach B', note: 'expected across futures', value: a.expected }])}
          <p class="quote">How different was the actual outcome from your initial forecast?</p>
          <p class="lead" style="margin-top:6px">${d ? `${fmt.money(Math.abs(d))} ${d > 0 ? 'above' : 'below'} the forecast of ${fmt.money(a.forecast)}.` : `It matched the forecast of ${fmt.money(a.forecast)}, this time.`} A forecast is not a guaranteed outcome.</p>
          ${actions(btn('next', 'See every possible outcome'))}`;
      }
      case '6:dist':
        return `<h2 class="h">All three plants, every possible outcome</h2>
          <div class="seg" role="group" aria-label="Plants shown">${[['all', 'All three']].concat(plants.map(p => [p.id, nm(p)])).map(([id, l]) => `<button type="button" data-action="view" data-id="${id}" aria-pressed="${s.view === id}">${l}</button>`).join('')}</div>
          <div class="dist"><div><div id="charts"></div>
            <p class="key"><span><i class="k-a"></i>A: average assumptions</span><span><i class="k-b"></i>B: expected across scenarios</span><span><i class="k-loss"></i>negative NPV</span><span><i class="k-draw"></i>the card you drew</span></p></div>
          <div>${metricsTable()}</div></div>
          <p class="aside">${decisionLine()}</p>${riskLine()}${actions(btn('finish', 'Finish'))}`;
      case '6:takeaways':
        return `<h2 class="h">Three things to take away</h2>
          <ol class="takeaways"><li>A forecast is not the future.</li><li>The Flaw of Averages can lead to misleading investment decisions.</li>
          <li>Understanding the distribution of possible outcomes improves decision-making under uncertainty.</li></ol>
          <p class="aside">When making decisions under uncertainty, calculating the outcome using average assumptions can be fundamentally different from calculating the average outcome across all possible futures.</p>
          <p class="lead" style="margin-top:12px">Once the distribution is known, it can be changed. A plant that could lift its limit in good years, or cut its costs in bad ones, would be worth more than any of these. That is the value of flexibility.</p>
          ${actions(btn('reset', 'Play again'))}`;
    }
    return '';
  }

  /* ── scene and floating indicators per stage ── */
  function sceneView() {
    const s = state, C = s.choice && byId(s.choice), a = C && AN[C.id];
    const v = { layout: 'row', focus: s.choice, hover: s.hover, plants: {}, scn: null, deck: 'hidden' };
    plants.forEach(p => { v.plants[p.id] = { face: 'front', ring: false, dim: 0, interactive: false, level: p.generation, marks: 0 }; });
    const mine = C && v.plants[C.id];
    if (s.stage === 1) plants.forEach(p => { v.plants[p.id].interactive = true; v.plants[p.id].ring = s.pick === p.id; });
    else if (s.stage === 2) { plants.forEach(p => { if (p.id !== C.id) v.plants[p.id].dim = 0.75; }); mine.ring = true; }
    else if (s.stage === 3 || s.stage === 4) {
      v.layout = 'futures'; mine.marks = 1; v.scn = {};
      a.outcomes.forEach(o => {
        const shown = s.stage === 4 || !!s.revealed[o.id];
        v.scn[o.id] = { revealed: shown, interactive: s.stage === 3 && !shown, level: !shown ? 0 : s.stage === 4 && s.sub === 'b' ? a.avgGen : o.generation };
      });
    } else if (s.stage === 5) {
      v.layout = 'draw'; mine.marks = 1; mine.ring = true; v.deck = s.sub === 'ready' ? 'ready' : 'revealed';
      if (s.sub !== 'ready') mine.level = a.byId[s.draw].generation;
    } else {
      v.layout = 'dist';
      plants.forEach(p => { const q = v.plants[p.id]; q.face = 'back'; q.marks = 1; if (s.sub === 'dist' && s.view !== 'all') { q.ring = s.view === p.id; q.dim = q.ring ? 0 : 0.75; } else q.ring = p.id === s.choice; });
    }
    return v;
  }
  const tg = (k, v, e) => `<small>${k}</small><strong>${v}</strong>${e ? `<em>${e}</em>` : ''}`;
  function plantTag(p) {
    const s = state, a = AN[p.id];
    if (s.stage >= 2 && s.stage <= 5 && p.id !== s.choice) return null;
    if (s.stage === 4 && s.sub === 'b') return tg('A: NPV of the average', fmt.money(a.npvAtAvg));
    if (s.stage === 4 && s.sub === 'c') return tg('B: average of the NPVs', fmt.money(a.expected), `A said ${fmt.money(a.npvAtAvg)}`);
    if (s.stage === 5 && s.sub === 'revealed') return tg('Realised NPV', fmt.money(a.byId[s.draw].npv));
    if (s.stage === 6) return (p.id === s.choice ? '<span class="badge">Your choice</span>' : '') + tg('Expected NPV', fmt.money(a.expected), `forecast said ${fmt.money(a.forecast)}`);
    return tg('Forecast NPV', fmt.money(a.forecast));
  }
  function scnTag(o, a) {
    const s = state;
    if (s.stage === 3) return s.revealed[o.id] ? tg('NPV', fmt.money(o.npv), note(o)) : tg(o.label, 'Turn over');
    if (s.stage === 4) return s.sub === 'b' ? tg('Treated as the average', fmt.gwh(a.avgGen)) : tg('NPV', fmt.money(o.npv), note(o));
    return null;
  }

  /* ── render ── */
  function render() {
    const s = state, key = s.stage + ':' + s.sub, changed = key !== lastKey, C = s.choice && byId(s.choice);
    stepsEl.innerHTML = STEPS.map((n, i) => `<li class="step${i + 1 < s.stage ? ' is-done' : ''}${i + 1 === s.stage ? ' is-now' : ''}"${i + 1 === s.stage ? ' aria-current="step"' : ''}><span class="step-card">${i + 1}</span><span class="step-name">${n}</span></li>`).join('');
    app.classList.toggle('wide', key === '4:c' || key === '6:dist');
    Charts.destroy();
    panel.innerHTML = `<div class="view${changed ? ' enter' : ''}">${panelHTML()}</div>`;
    if (changed) panel.scrollTop = 0;
    const fills = panel.querySelectorAll('.bar-fill'), settle = () => fills.forEach(el => { el.style.left = el.dataset.l + '%'; el.style.width = el.dataset.w + '%'; });
    if (changed && !reduceMotion) requestAnimationFrame(() => requestAnimationFrame(settle)); else settle();
    if (key === '6:dist') Charts.dist(panel.querySelector('#charts'), s.view, s.draw && { [s.choice]: s.draw });
    if (key === '4:c') { Charts.jensen(panel.querySelector('#jensen'), C); if (changed) count(panel.querySelector('#tileB'), AN[C.id].npvAtAvg, AN[C.id].expected, 1400, 500); }
    lastKey = key;

    Scene3D.sync(sceneView());
    plants.forEach(p => Scene3D.setTag(p.id, plantTag(p), cv(p)));
    Finance.scenarios.forEach(sc => Scene3D.setTag('scn:' + sc.id, C ? scnTag(AN[C.id].byId[sc.id], AN[C.id]) : null, C && cv(C)));
    Scene3D.setTag('deck', s.stage === 5 && s.sub === 'ready' ? tg('The futures, shuffled', 'Draw a card') : null);
  }
  function count(el, from, to, dur, delay) {
    if (!el || reduceMotion) return;
    el.textContent = fmt.money(from);
    const t0 = performance.now() + (delay || 0);
    (function tick(now) {
      if (!el.isConnected) return;
      const u = clamp((now - t0) / dur, 0, 1), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      el.textContent = fmt.money(from + (to - from) * e);
      if (u < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  /* ── actions ── */
  const act = {
    select(id) { if (state.stage !== 1 || !byId(id)) return; state.pick = id; render(); },
    invest() { const s = state; if (!s.pick) return; s.choice = s.pick; s.stage = 2; s.sub = 'calc'; s.hover = null; Scene3D.setFocus(byId(s.choice)); render(); },
    reveal(id) {
      const s = state; if (s.stage !== 3 || s.revealed[id]) return;
      s.revealed[id] = true; if (Finance.scenarios.every(sc => s.revealed[sc.id])) s.sub = 'seen'; render();
    },
    runA() { if (state.stage === 4 && state.sub === 'a') { state.sub = 'b'; render(); } },
    runB() { if (state.stage === 4 && state.sub === 'b') { state.sub = 'c'; render(); } },
    replay() { if (lastKey === '4:c') { Charts.jensen(panel.querySelector('#jensen'), byId(state.choice)); count(panel.querySelector('#tileB'), AN[state.choice].npvAtAvg, AN[state.choice].expected, 1400, 2450); } },
    draw() {
      const s = state; if (s.stage !== 5 || s.sub !== 'ready') return;
      const C = byId(s.choice), a = AN[C.id];
      s.draw = Finance.draw(); s.sub = 'drawing';
      Scene3D.setDrawFace(C, a.byId[s.draw]); Scene3D.kick(); render();
      later(() => { s.sub = 'revealed'; render(); count(Scene3D.tagValueEl(C.id), a.forecast, a.byId[s.draw].npv, 900); }, reduceMotion || !Scene3D.ok ? 60 : 1150);
    },
    view(id) { state.view = id; render(); },
    finish() { state.sub = 'takeaways'; render(); },
    next() {
      const s = state, to = { '2:calc': [3, 'deal'], '3:seen': [4, 'a'], '4:c': [5, 'ready'], '5:revealed': [6, 'dist'] }[s.stage + ':' + s.sub];
      if (!to) return; s.stage = to[0]; s.sub = to[1]; s.hover = null; render();
    },
    reset() { timers.forEach(clearTimeout); timers = []; state = fresh(); Scene3D.setFocus(null); render(); }
  };
  function hover(key) {
    if (state.hover === key) return;
    state.hover = key;
    panel.querySelectorAll('.choice').forEach(b => b.classList.toggle('is-hover', b.dataset.id === key));
    Scene3D.sync(sceneView());
  }
  function pick(key) {
    if (key === 'deck') act.draw();
    else if (key.indexOf('scn:') === 0) act.reveal(key.slice(4));
    else act.select(key);
  }

  function init() {
    panel.addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (b && !b.disabled && act[b.dataset.action]) act[b.dataset.action](b.dataset.id); });
    panel.addEventListener('pointerover', e => { const b = e.target.closest('.choice'); if (b) hover(b.dataset.id); });
    panel.addEventListener('pointerout', e => { if (e.target.closest('.choice') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.choice'))) hover(null); });
    panel.addEventListener('focusin', e => { const b = e.target.closest('.choice'); if (b) hover(b.dataset.id); });
    $('#restart').addEventListener('click', act.reset);
    Scene3D.onHover = hover; Scene3D.onPick = pick;
    Theme.onChange(() => { if (lastKey === '6:dist' || lastKey === '4:c') render(); });
    if (!Scene3D.ok) { document.body.classList.add('no3d'); $('#free').textContent = 'The 3D table could not start in this browser. The game still works from the panel.'; }
    render();
  }
  return { init };
})();

Game.init();
})();
</script>
</body>
</html>
